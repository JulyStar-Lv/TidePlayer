# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
resolver = "2"
members = [
    "app-backend",
    "audio-dsp",
    "uniffi-bindgen",
    "async-runtime",
    "order-key",
    "storage-backend",
    "audio-metadata",
    "plugin-runtime",
]
exclude = ["vendor/lofty"]

[profile.bench]
debug = true
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = "symbols"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_with = "3.14.0"
serde_json = "1.0"
uniffi = "=0.29.4"
bitcode = "0.6.3"
postcard = { version = "1.1.3", features = ["alloc"] }
futures = "0.3.30"
async-channel = "2.5.0"
thiserror = "1.0.57"
chrono = "0.4.41"
anyhow = "1.0"
tracing = "0.1"
audio-dsp = { path = "./audio-dsp" }
triple_buffer = "9.0.0"
async-runtime = { path = "./async-runtime" }
order-key = { path = "./order-key" }

[patch.crates-io]
lofty = { path = "vendor/lofty" }
