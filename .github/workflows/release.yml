name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "pre-v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Prepare GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi

          release_args=(
            release create "$GITHUB_REF_NAME"
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --title "$GITHUB_REF_NAME"
            --generate-notes
          )
          if [[ "$GITHUB_REF_NAME" == pre-v* ]]; then
            release_args+=(--prerelease)
          fi
          gh "${release_args[@]}"

  android:
    name: Android release
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve app version
        run: |
          version="${GITHUB_REF_NAME#pre-v}"
          version="${version#v}"
          {
            echo "APP_VERSION_NAME=$version"
            echo "APP_VERSION_CODE=$GITHUB_RUN_NUMBER"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923
          packages: ""
      - name: Install Android 17 SDK
        run: bash scripts/ci/install-android-sdk.sh
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28-beta2
          add-to-path: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libasound2-dev pkg-config
          cargo install --locked cargo-ndk@3.5.4
          pnpm install --frozen-lockfile
      - name: Build signed APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_SIGN_JKS: ${{ secrets.ANDROID_SIGN_JKS }}
          ANDROID_SIGN_PASSWORD: ${{ secrets.ANDROID_SIGN_PASSWORD }}
          ANDROID_SIGN_KEY_ALIAS: ${{ secrets.ANDROID_SIGN_KEY_ALIAS }}
          ANDROID_SIGN_KEY_PASSWORD: ${{ secrets.ANDROID_SIGN_KEY_PASSWORD }}
        run: |
          mkdir -p ~/.gradle
          echo "ANDROID_NDK=$ANDROID_NDK_HOME" >> ~/.gradle/gradle.properties
          pnpm run build:apk
      - name: Audit release artifacts
        run: pnpm run audit:release
      - uses: actions/upload-artifact@v4
        with:
          name: tideplayer-android-all-arches-${{ github.ref_name }}
          path: artifacts/apk/*.apk
          if-no-files-found: error
      - name: Upload APK to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" artifacts/apk/*.apk --clobber

  desktop:
    name: Desktop ${{ matrix.platform }} release
    needs: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            arch: x86_64
            runner: macos-13
            gradle_task: :desktopApp:packageReleaseDmg
            artifact_path: desktopApp/build/compose/binaries/main-release/dmg/*.dmg
            artifact_output: artifacts/desktop/TidePlayer-x86_64.dmg
            format: dmg
          - platform: macOS
            arch: arm64
            runner: macos-14
            gradle_task: :desktopApp:packageReleaseDmg
            artifact_path: desktopApp/build/compose/binaries/main-release/dmg/*.dmg
            artifact_output: artifacts/desktop/TidePlayer-arm64.dmg
            format: dmg
          - platform: Windows
            arch: x86_64
            runner: windows-latest
            gradle_task: :desktopApp:packageReleaseExe
            artifact_path: desktopApp/build/compose/binaries/main-release/exe/*.exe
            artifact_output: artifacts/desktop/TidePlayer-x86_64.exe
            format: exe
          - platform: Linux
            arch: x86_64
            runner: ubuntu-latest
            gradle_task: :desktopApp:packageReleaseDeb
            artifact_path: desktopApp/build/compose/binaries/main-release/deb/*.deb
            artifact_output: artifacts/desktop/TidePlayer-x86_64.deb
            format: deb
            upload_mapping: true
          - platform: Linux
            arch: x86_64
            runner: ubuntu-latest
            gradle_task: :desktopApp:packageReleaseRpm
            artifact_path: desktopApp/build/compose/binaries/main-release/rpm/*.rpm
            artifact_output: artifacts/desktop/TidePlayer-x86_64.rpm
            format: rpm
            upload_mapping: false
          - platform: Linux
            arch: x86_64
            runner: ubuntu-latest
            gradle_task: :desktopApp:packageReleaseAppImage
            artifact_path: desktopApp/build/compose/binaries/main-release/app
            artifact_output: artifacts/desktop/TidePlayer-x86_64.AppImage
            format: appimage
            upload_mapping: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve app version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#pre-v}"
          version="${version#v}"
          {
            echo "APP_VERSION_NAME=$version"
            echo "APP_VERSION_CODE=$GITHUB_RUN_NUMBER"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libasound2-dev pkg-config
      - name: Build desktop package
        shell: bash
        run: ./gradlew --no-daemon --stacktrace "${{ matrix.gradle_task }}"
      - name: Rename desktop package with architecture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/desktop
          if [[ "${{ matrix.format }}" == "appimage" ]]; then
            mapfile -t packages < <(find "${{ matrix.artifact_path }}" -maxdepth 1 -type f -perm -111 -print)
          else
            packages=( ${{ matrix.artifact_path }} )
          fi
          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "Expected exactly one desktop package, found ${#packages[@]}" >&2
            exit 1
          fi
          cp "${packages[0]}" "${{ matrix.artifact_output }}"
      - name: Audit release artifacts
        run: node scripts/audit-release.js
      - uses: actions/upload-artifact@v4
        with:
          name: tideplayer-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.format }}-${{ github.ref_name }}
          path: ${{ matrix.artifact_output }}
          if-no-files-found: error
      - name: Upload desktop package to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" ${{ matrix.artifact_output }} --clobber
      - name: Upload desktop R8 mapping to GitHub release
        if: matrix.upload_mapping == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" desktopApp/build/compose/proguard/mapping.txt --clobber
