name: TidePlayer documentation legacy-name audit

on:
  push:
    branches:
      - docs/tideplayer-readme-zh

permissions:
  contents: read

jobs:
  audit-doc-brand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: docs/tideplayer-readme-zh
          fetch-depth: 0

      - name: Report remaining legacy names
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roots = [Path('README.md'), Path('docs'), Path('Design'), Path('core'), Path('rust-libs')]
          matches = []
          for root in roots:
              paths = [root] if root.is_file() else root.rglob('*.md')
              for path in paths:
                  if not path.is_file() or path.suffix.lower() != '.md':
                      continue
                  try:
                      lines = path.read_text(encoding='utf-8').splitlines()
                  except UnicodeDecodeError:
                      continue
                  for number, line in enumerate(lines, 1):
                      if 'MelodyTrove' in line or '旋律珍藏' in line:
                          matches.append((path.as_posix(), number, line.strip()))

          print(f'Remaining legacy-name lines: {len(matches)}')
          for path, number, line in matches:
              print(f'{path}:{number}: {line}')
          PY
