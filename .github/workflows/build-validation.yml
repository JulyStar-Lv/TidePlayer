name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 5
  CARGO_HTTP_TIMEOUT: 120

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libasound2-dev pkg-config
      - name: Fetch Rust dependencies
        run: |
          for attempt in 1 2 3; do
            if cargo fetch --locked --manifest-path rust-libs/Cargo.toml; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Format, lint, and test
        run: |
          cargo fmt --manifest-path rust-libs/Cargo.toml --all -- --check
          cargo clippy --manifest-path rust-libs/Cargo.toml --workspace --all-targets -- -D warnings
          cargo test --manifest-path rust-libs/Cargo.toml --workspace

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923
          packages: ""
      - name: Reclaim runner disk space
        run: |
          sudo rm -rf \
            "${ANDROID_SDK_ROOT:?}/system-images" \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost
          sudo apt-get clean
      - name: Install Android 17 SDK
        run: bash scripts/ci/install-android-sdk.sh
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28-beta2
          add-to-path: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - name: Install cargo-ndk
        run: |
          for attempt in 1 2 3; do
            if cargo +stable install --locked cargo-ndk@3.5.4; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Configure Android NDK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir -p ~/.gradle
          echo "ANDROID_NDK=$ANDROID_NDK_HOME" >> ~/.gradle/gradle.properties
      - name: Check SMB Android targets
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./scripts/check-smb-cross-targets.sh android
      - name: Build debug APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./gradlew --no-daemon --stacktrace :androidApp:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tideplayer-android-debug-${{ github.run_number }}
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  desktop:
    name: Desktop and Kotlin tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libasound2-dev pkg-config
      - name: Compile Desktop and run shared tests
        run: ./gradlew --no-daemon --stacktrace :desktopApp:compileKotlinDesktop :shared:desktopTest

  ios:
    name: iOS Simulator
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Report Xcode and Swift versions
        run: |
          xcodebuild -version
          xcrun swift --version
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Compile Kotlin and UniFFI for iOS Simulator
        run: ./gradlew --no-daemon --stacktrace :shared:compileKotlinIosSimulatorArm64
      - name: Build unsigned iOS Simulator app
        run: |
          xcodebuild \
            -project iosApp/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build
